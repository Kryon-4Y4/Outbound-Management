# Actuator 监控配置
management:
  endpoints:
    web:
      exposure:
        # 暴露所有端点（生产环境建议只暴露必要的）
        include: health,info,metrics,prometheus,env,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      show-components: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true
    java:
      enabled: true

# 应用信息
info:
  app:
    name: WMS仓库管理系统
    version: 1.0.0
    description: 基于Spring Boot的企业级仓储管理系统
  contact:
    team: WMS Team
    email: support@wms.com
